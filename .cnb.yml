# ==========================================================================
# 小账本 · CNB 云原生配置
#
# 三段配置：
#   include   —— 从中心 CI 仓库引入作品自动化检查流水线（模板要求保留，勿改写）；
#   main.push —— 推到 main 分支时自动构建并推送镜像到 CNB 制品库；
#   $         —— 「仅预览模式」：访客点右上角按钮，不进 IDE，直接看预览页。
#
# ⚠️ 顺序不能反：launch 拉的是 main.push 推上去的镜像，镜像不存在时预览页会一直
#    转圈打不开。所以第一次点按钮之前，必须先往 main 推一次，让镜像先构建出来。
#
# ⚠️ 三条铁律（踩过坑的都懂）：
#   1. launch 里的镜像地址必须是**常量**。用 ${CNB_DOCKER_REGISTRY} 之类的变量
#      会导致别人 Fork 后解析到自己仓库的路径，而对方仓库没构建过镜像 → 启动必失败。
#      👉 已写死为本仓库地址 docker.cnb.cool/yythlss/keep-track-of-expenses:latest，
#         换仓库时记得同步修改（launch 那一行）。
#   2. 服务必须监听 0.0.0.0（本项目已在 run.py 中固定），监听 127.0.0.1 预览打不开。
#   3. 端口四处对齐：Dockerfile EXPOSE / PORT 环境变量 / launch 命令 / 应用监听。
#
# ⚠️ onlyPreview 会让主分支再也点不进 IDE。继续开发请新建 dev 分支，
#    在 dev 分支用 docs/cnb-开发分支配置.yml 覆盖本文件（README 有详细步骤）。
# ==========================================================================

# ---- 作品自动化检查流水线，从中心 CI 仓库引入 ----
# 模板明确要求保留这一段：检查逻辑（提交规范 / 可构建 / 可运行 / AI 评审）集中在
# 中心仓库维护、统一升级，作品侧不要改写，也不要删掉。
include:
  - https://cnb.cool/whut1/ai-engineering-exercise-ci/-/blob/main/hackathon.yml

main:
  push:
    - stages:
        - name: build-and-push
          script: |
            set -euo pipefail
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest"
            echo "构建镜像：${IMAGE}"
            docker build -t "${IMAGE}" .
            docker push "${IMAGE}"
            echo "镜像已就绪，可以点右上角「🐷 开始记账」了"
      services:
        - docker

$:
  vscode:
    - runner:
        cpus: 8
      env:
        VIRTUAL_ENV_DISABLE_PROMPT: "1"
      services:
        - docker
        # ⚠️ 用「对象形式」声明 vscode 服务时，CNB 官方 schema 强制要求本流水线
        #    必须同时存在 stages 段（见文末说明），否则整份 .cnb.yml 校验不通过，
        #    所有流水线（包括 main.push）都不会触发。
        - name: vscode
          options:
            # 跳过 IDE，点按钮直接出业务端口预览页
            onlyPreview: true
            # ⚠️ launch / daemon / keepAliveTimeout 都写在 options 内，与 options
            #    平级 CNB 不会识别（参照已跑通的 git-demo 仓库，写法与之一致）。
            # 用 >- 折行成单行命令；-e 透传平台注入的三个大模型环境变量，
            # 容器里就能零密钥调用 CNB LLM
            launch: >-
              docker run -d --network host
              -e PORT=8686
              -e CNB_API_ENDPOINT -e CNB_REPO_SLUG -e CNB_TOKEN
              docker.cnb.cool/yythlss/keep-track-of-expenses:latest
            keepAliveTimeout: 3600000
            # 排查阶段建议改回 false，这样能在构建日志里看到 launch 的输出
            daemon: true
      # 对象形式 vscode 服务时必须提供的 stages（内容可为空脚本）
      stages:
        - name: prepare
          script: |
            echo "仅预览模式：准备以 docker run 拉起业务容器（监听 8686）"

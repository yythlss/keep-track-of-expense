<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍄 超级玛丽</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang SC", sans-serif; background: #0f172a; color: #e2e8f0;
           min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px; }
    a.back { align-self: flex-start; color: #f87171; text-decoration: none; margin-bottom: 12px; }
    h1 { margin-bottom: 6px; }
    .hud { color: #f87171; font-size: 16px; margin-bottom: 12px; display: flex; gap: 24px; }
    canvas { background: #5c94fc; border: 3px solid #f87171; border-radius: 8px; }
    .hint { color: #64748b; font-size: 14px; margin-top: 14px; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← 返回大厅</a>
  <h1>🍄 超级玛丽</h1>
  <div class="hud">
    <span>关卡 <b id="level">1</b>/2</span>
    <span>生命 <b id="lives">3</b></span>
    <span>金币 <b id="coins">0</b></span>
  </div>
  <canvas id="c" width="800" height="400"></canvas>
  <p class="hint">← → 移动 · 空格 / ↑ 跳跃 · 踩扁小怪 · 收集金币 · 抵达旗帜过关 · 回车重来</p>

  <script>
    const cv = document.getElementById("c");
    const ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    const G = 0.6, SPEED = 3.2, JUMP = -12.2;
    const levelEl = document.getElementById("level");
    const livesEl = document.getElementById("lives");
    const coinsEl = document.getElementById("coins");

    // 两个关卡定义 关卡数刻意精简
    const LEVELS = [
      {
        width: 1600,
        start: { x: 40, y: 300 },
        platforms: [
          { x: 0, y: 360, w: 1600, h: 40 },
          { x: 250, y: 280, w: 110, h: 16 },
          { x: 460, y: 220, w: 110, h: 16 },
          { x: 720, y: 280, w: 130, h: 16 },
          { x: 1000, y: 240, w: 110, h: 16 },
          { x: 1240, y: 300, w: 120, h: 16 },
        ],
        coins: [
          { x: 290, y: 245 }, { x: 500, y: 185 }, { x: 760, y: 245 },
          { x: 1040, y: 205 }, { x: 1280, y: 265 }, { x: 600, y: 320 },
        ],
        enemies: [
          { x: 600, min: 560, max: 800 }, { x: 1050, min: 980, max: 1180 },
        ],
        goal: { x: 1520, y: 280, w: 24, h: 80 },
      },
      {
        width: 1800,
        start: { x: 40, y: 300 },
        // 地面留出两处坑 掉下去即死
        platforms: [
          { x: 0, y: 360, w: 480, h: 40 },
          { x: 620, y: 360, w: 480, h: 40 },
          { x: 1260, y: 360, w: 540, h: 40 },
          { x: 300, y: 260, w: 100, h: 16 },
          { x: 520, y: 240, w: 90, h: 16 },   // 坑上踏板
          { x: 800, y: 250, w: 110, h: 16 },
          { x: 1120, y: 240, w: 100, h: 16 }, // 坑上踏板
          { x: 1420, y: 260, w: 120, h: 16 },
        ],
        coins: [
          { x: 330, y: 225 }, { x: 550, y: 205 }, { x: 840, y: 215 },
          { x: 1150, y: 205 }, { x: 1460, y: 225 }, { x: 700, y: 320 }, { x: 1000, y: 320 },
        ],
        enemies: [
          { x: 820, min: 780, max: 900 }, { x: 1420, min: 1380, max: 1540 },
        ],
        goal: { x: 1720, y: 280, w: 24, h: 80 },
      },
    ];

    let lvIdx, player, cam, coinsGot, lives, over, won, level;

    function loadLevel(i) {
      lvIdx = i;
      level = LEVELS[i];
      // 深拷贝可变对象 便于重开
      level.coinsState = level.coins.map((c) => ({ ...c, got: false }));
      level.enemiesState = level.enemies.map((e) => ({ ...e, x: e.x, dir: 1, alive: true, w: 26, h: 26 }));
      player = { x: level.start.x, y: level.start.y, w: 26, h: 30, vx: 0, vy: 0, onGround: false };
      cam = 0;
      levelEl.textContent = i + 1;
    }

    function reset() {
      coinsGot = 0; lives = 3; over = false; won = false;
      loadLevel(0);
      coinsEl.textContent = coinsGot;
      livesEl.textContent = lives;
    }

    function respawn() {
      lives--;
      livesEl.textContent = lives;
      if (lives <= 0) { over = true; return; }
      player.x = level.start.x; player.y = level.start.y; player.vx = 0; player.vy = 0;
    }

    function hit(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    const keys = {};
    document.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(e.key)) e.preventDefault();
      if (e.key === "Enter" && (over || won)) reset();
    });
    document.addEventListener("keyup", (e) => { keys[e.key] = false; });

    function update() {
      if (over || won) return;

      // 水平输入
      player.vx = 0;
      if (keys["ArrowLeft"]) player.vx = -SPEED;
      if (keys["ArrowRight"]) player.vx = SPEED;
      if ((keys[" "] || keys["ArrowUp"]) && player.onGround) { player.vy = JUMP; player.onGround = false; }

      // 重力
      player.vy += G;
      if (player.vy > 16) player.vy = 16;

      // 先解决水平轴碰撞
      player.x += player.vx;
      for (const p of level.platforms) {
        if (hit(player, p)) {
          if (player.vx > 0) player.x = p.x - player.w;
          else if (player.vx < 0) player.x = p.x + p.w;
        }
      }
      if (player.x < 0) player.x = 0;

      // 再解决垂直轴碰撞
      player.y += player.vy;
      player.onGround = false;
      for (const p of level.platforms) {
        if (hit(player, p)) {
          if (player.vy > 0) { player.y = p.y - player.h; player.vy = 0; player.onGround = true; }
          else if (player.vy < 0) { player.y = p.y + p.h; player.vy = 0; }
        }
      }

      // 掉出画面底部 = 死亡
      if (player.y > H + 60) respawn();

      // 金币
      level.coinsState.forEach((c) => {
        if (!c.got && hit(player, { x: c.x, y: c.y, w: 16, h: 16 })) {
          c.got = true; coinsGot++; coinsEl.textContent = coinsGot;
        }
      });

      // 小怪移动与碰撞
      level.enemiesState.forEach((e) => {
        if (!e.alive) return;
        e.x += e.dir * 1.1;
        if (e.x < e.min || e.x > e.max) e.dir *= -1;
        const ebox = { x: e.x, y: 360 - e.h, w: e.w, h: e.h };
        if (hit(player, ebox)) {
          // 从上方踩中 玩家在下落且底部接近怪物顶部
          if (player.vy > 0 && player.y + player.h - player.vy <= ebox.y + 8) {
            e.alive = false; player.vy = -8; coinsGot += 1; coinsEl.textContent = coinsGot;
          } else {
            respawn();
          }
        }
      });

      // 抵达旗帜
      if (hit(player, level.goal)) {
        if (lvIdx < LEVELS.length - 1) loadLevel(lvIdx + 1);
        else won = true;
      }

      // 摄像机跟随
      cam = Math.max(0, Math.min(player.x - W / 2, level.width - W));
    }

    function draw() {
      // 天空
      ctx.fillStyle = "#5c94fc";
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.translate(-cam, 0);

      // 平台 地面绿 踏板棕
      level.platforms.forEach((p) => {
        ctx.fillStyle = p.h >= 40 ? "#3f8b3f" : "#b8712e";
        ctx.fillRect(p.x, p.y, p.w, p.h);
        if (p.h >= 40) { ctx.fillStyle = "#6ab04c"; ctx.fillRect(p.x, p.y, p.w, 6); }
      });

      // 金币
      level.coinsState.forEach((c) => {
        if (c.got) return;
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(c.x + 8, c.y + 8, 8, 0, Math.PI * 2);
        ctx.fill();
      });

      // 小怪
      level.enemiesState.forEach((e) => {
        if (!e.alive) return;
        ctx.fillStyle = "#7c3f1d";
        ctx.fillRect(e.x, 360 - e.h, e.w, e.h);
        ctx.fillStyle = "#fff";
        ctx.fillRect(e.x + 4, 360 - e.h + 6, 5, 5);
        ctx.fillRect(e.x + e.w - 9, 360 - e.h + 6, 5, 5);
      });

      // 旗帜
      const gl = level.goal;
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(gl.x + gl.w / 2 - 2, gl.y - 40, 4, gl.h + 40);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(gl.x + gl.w / 2, gl.y - 40, 28, 18);

      // 玩家 (红帽子玛丽)
      ctx.fillStyle = "#e11d48";
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = "#fcd34d";
      ctx.fillRect(player.x + 4, player.y + 12, player.w - 8, 10);

      ctx.restore();

      if (over || won) {
        ctx.fillStyle = "rgba(0,0,0,.7)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = won ? "#34d399" : "#f87171";
        ctx.textAlign = "center";
        ctx.font = "36px sans-serif";
        ctx.fillText(won ? "🎉 通关啦" : "💀 游戏结束", W / 2, H / 2 - 10);
        ctx.fillStyle = "#fff";
        ctx.font = "16px sans-serif";
        ctx.fillText("金币 " + coinsGot + " · 按回车重新开始", W / 2, H / 2 + 26);
      }
    }

    reset();
    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>

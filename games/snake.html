<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐍 贪吃蛇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang SC", sans-serif; background: #0f172a; color: #e2e8f0;
           min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px; }
    a.back { align-self: flex-start; color: #34d399; text-decoration: none; margin-bottom: 12px; }
    h1 { margin-bottom: 6px; }
    .score { color: #34d399; font-size: 18px; margin-bottom: 12px; }
    canvas { background: #020617; border: 3px solid #34d399; border-radius: 8px; }
    .hint { color: #64748b; font-size: 14px; margin-top: 14px; }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← 返回大厅</a>
  <h1>🐍 贪吃蛇</h1>
  <div class="score">得分 <span id="score">0</span></div>
  <canvas id="c" width="400" height="400"></canvas>
  <p class="hint">方向键控制移动 · 空格重新开始</p>

  <script>
    const cv = document.getElementById("c");
    const ctx = cv.getContext("2d");
    const scoreEl = document.getElementById("score");
    const N = 20;           // 每行格子数
    const S = cv.width / N; // 单格像素

    let snake, dir, nextDir, food, score, over;

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      over = false;
      placeFood();
      scoreEl.textContent = score;
    }

    // 在非蛇身格子随机放置食物
    function placeFood() {
      while (true) {
        const f = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 };
        if (!snake.some((s) => s.x === f.x && s.y === f.y)) { food = f; return; }
      }
    }

    function step() {
      if (over) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // 撞墙或撞到自己判定
      if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
          snake.some((s) => s.x === head.x && s.y === head.y)) {
        over = true;
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop(); // 没吃到就去掉尾巴 长度不变
      }
    }

    function draw() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, cv.width, cv.height);

      // 食物
      ctx.fillStyle = "#f87171";
      ctx.fillRect(food.x * S + 2, food.y * S + 2, S - 4, S - 4);

      // 蛇身
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? "#34d399" : "#059669";
        ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
      });

      if (over) {
        ctx.fillStyle = "rgba(0,0,0,.65)";
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "28px sans-serif";
        ctx.fillText("游戏结束", cv.width / 2, cv.height / 2 - 10);
        ctx.font = "16px sans-serif";
        ctx.fillText("得分 " + score + " · 按空格重来", cv.width / 2, cv.height / 2 + 24);
      }
    }

    document.addEventListener("keydown", (e) => {
      const map = {
        ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
      };
      if (e.key === " ") { if (over) reset(); return; }
      const d = map[e.key];
      if (!d) return;
      e.preventDefault();
      // 禁止直接反向
      if (d.x === -dir.x && d.y === -dir.y) return;
      nextDir = d;
    });

    reset();
    setInterval(() => { step(); draw(); }, 120);
  </script>
</body>
</html>
